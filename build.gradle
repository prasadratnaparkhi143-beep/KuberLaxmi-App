plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kuberlaxmi.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kuberlaxmi.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
